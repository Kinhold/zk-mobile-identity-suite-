name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  age-proof-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: age-proof
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: age-proof/package-lock.json
      - run: npm ci
      - run: npm run contracts:compile
      - run: npm test
      - run: npm run pack:check
      - name: Audit production dependencies
        run: npm audit --omit=dev

  age-proof-circuit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: age-proof
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Noir compiler
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://raw.githubusercontent.com/noir-lang/noirup/main/install | bash
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
          "$HOME/.nargo/bin/noirup" -v 1.0.0-beta.21
      - run: nargo compile
      - run: nargo test
