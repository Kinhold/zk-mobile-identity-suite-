name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install npm dependencies
      run: npm install
      working-directory: ./age-proof

    - name: Install Noir
      run: curl -L https://raw.githubusercontent.com/noir-lang/noirup/main/install | bash

    - name: Add Noir to PATH
      run: echo "$HOME/.nargo/bin" >> $GITHUB_PATH

    - name: Run nargo compile
      run: nargo compile
      working-directory: ./age-proof

    - name: Run nargo test
      run: nargo test
      working-directory: ./age-proof

    - name: Check for contracts files
      run: |
        ls ./contracts/Verifier.sol
        ls ./contracts/AgeProofVerifier.sol
      working-directory: ./age-proof
